server.port=8080
server.servlet.context-path=/api
logging.level.com.hendisantika=DEBUG
# Data source properties (embedded H2, schema.sql + data.sql are applied on startup)
spring.datasource.url=jdbc:h2:mem:oauth2db;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# RSA key pair (2048 bit) used to sign / verify the JWT access tokens
# openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
config.oauth2.privateKey=classpath:jwt/private.pem
# openssl pkey -in private.pem -pubout -out public.pem
config.oauth2.publicKey=classpath:jwt/public.pem
#oauth configurations
config.oauth2.issuer=http://localhost:8080/api
config.oauth2.tokenTimeout=3600
config.oauth2.resource.id=oauth2-resource
config.oauth2.clientID=client
config.oauth2.clientSecret=secret
config.oauth2.accessTokenUri=http://localhost:8080/api/oauth/token
# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.oauth.client-id=${config.oauth2.clientID}
springdoc.swagger-ui.oauth.client-secret=${config.oauth2.clientSecret}
